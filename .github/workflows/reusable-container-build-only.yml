name: Reusable · Container Build (no push)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Container image name (e.g. naira-api). Defaults to repo name."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context path"
        type: string
        default: "."
      platforms:
        description: "Comma-separated list of target platforms"
        type: string
        default: "linux/amd64,linux/arm64"
      amd64-runner:
        description: "Runner label for linux/amd64 builds (also used for any non-arm64 platform)"
        type: string
        default: "ubuntu-24.04"
      arm64-runner:
        description: "Runner label for linux/arm64 builds (free for public repos only)"
        type: string
        default: "ubuntu-24.04-arm"
      registry:
        description: "Container registry hostname"
        type: string
        default: "ghcr.io"
      build-args:
        description: "Newline-separated Docker build args (KEY=VALUE)"
        type: string
        default: ""
      image-labels:
        description: "Extra OCI labels (newline-separated KEY=VALUE)"
        type: string
        default: ""
    outputs:
      image-digest:
        description: "Digest of one platform build (not pushed, informational only)"
        value: ${{ jobs.build-only.outputs.digest }}
      image-tags:
        description: "Newline-separated list of tags the image would get"
        value: ${{ jobs.build-only.outputs.tags }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      platforms: ${{ steps.vars.outputs.platforms }}
      slug: ${{ steps.vars.outputs.slug }}
    steps:
      - name: Build matrix
        id: vars
        run: |
          SHORT_NAME="${INPUTS_IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          # Same cache scope as reusable-container-build.yml, so PRs reuse the main branch cache
          SLUG="$(printf '%s' "$SHORT_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          # "linux/amd64, linux/arm64" -> ["linux/amd64","linux/arm64"]
          PLATFORMS="$(jq -cRn --arg p "$INPUTS_PLATFORMS" '$p | split(",") | map(gsub("\\s"; "")) | map(select(. != ""))')"
          {
            echo "slug=$SLUG"
            echo "platforms=$PLATFORMS"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUTS_IMAGE_NAME: ${{ inputs.image-name }}
          INPUTS_PLATFORMS: ${{ inputs.platforms }}

  build-only:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm64') && inputs.arm64-runner || inputs.amd64-runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve image name and platform slug
        id: vars
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          SHORT_NAME="${INPUTS_IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          echo "image=${INPUTS_REGISTRY}/${OWNER}/$(echo "$SHORT_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # linux/arm64 -> linux-arm64
          echo "platform=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_IMAGE_NAME: ${{ inputs.image-name }}
          INPUTS_REGISTRY: ${{ inputs.registry }}
          PLATFORM: ${{ matrix.platform }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ steps.vars.outputs.image }}
          labels: |
            org.opencontainers.image.vendor=Naira Project
            ${{ inputs.image-labels }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Only needed for platforms without a native runner (e.g. linux/arm/v7)
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64' && !startsWith(matrix.platform, 'linux/arm64')
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.slug }}-${{ steps.vars.outputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.slug }}-${{ steps.vars.outputs.platform }}
