#
# Builds a linux/amd64 + linux/arm64 image on native runners (no QEMU):
#   1. build    – one job per architecture, pushed by digest (untagged)
#   2. publish  – combine both digests into one multi-arch image, tag, sign and attest it

name: Reusable · Container Build & Publish

on:
  workflow_call:
    inputs:
      image-name:
        description: "Container image name (e.g. naira-api). Defaults to repo name."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context path"
        type: string
        default: "."
      platforms:
        description: "Deprecated and ignored: images are always built for linux/amd64 and linux/arm64"
        type: string
        default: ""
      registry:
        description: "Container registry hostname"
        type: string
        default: "ghcr.io"
      build-args:
        description: "Newline-separated Docker build args (KEY=VALUE)"
        type: string
        default: ""
      image-labels:
        description: "Extra OCI labels (newline-separated KEY=VALUE)"
        type: string
        default: ""
      sign:
        description: "Sign the published image with Cosign (keyless / GitHub OIDC)"
        type: boolean
        default: true
      provenance-retention-days:
        description: "Retention period for uploaded provenance bundles"
        type: number
        default: 90
      image-tag:
        description: "Explicit tag to apply (overrides branch naming for releases)"
        type: string
        default: ""
    secrets:
      registry-username:
        description: "Registry username (defaults to github.actor if not set)"
        required: false
      registry-password:
        description: "Registry password / token"
        required: true
    outputs:
      image-digest:
        description: "Published multi-arch manifest digest (sha256:...)"
        value: ${{ jobs.publish.outputs.digest }}
      image-tags:
        description: "Newline-separated list of applied image tags"
        value: ${{ jobs.publish.outputs.tags }}
      image-name:
        description: "Full image name without tag (e.g. ghcr.io/org/naira-catalog)"
        value: ${{ jobs.build.outputs.image }}
      image-ref:
        description: "Published image reference pinned by digest"
        value: ${{ jobs.build.outputs.image }}@${{ jobs.publish.outputs.digest }}
      attestation-url:
        description: "GitHub attestation summary URL for the pushed image"
        value: ${{ jobs.publish.outputs.attestation-url }}
      provenance-artifact-name:
        description: "Name of the uploaded provenance bundle artifact"
        value: provenance-${{ jobs.build.outputs.slug }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    # Same value in every matrix leg, so the publish job can read them from here
    outputs:
      image: ${{ steps.image.outputs.full }}
      slug: ${{ steps.image.outputs.slug }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        run: |
          if [ -n "$INPUTS_PLATFORMS" ]; then
            echo "::warning::The 'platforms' input is deprecated and ignored (always linux/amd64 + linux/arm64), remove it."
          fi
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          SHORT_NAME="${INPUTS_IMAGE_NAME:-${GITHUB_REPOSITORY#*/}}"
          echo "full=${INPUTS_REGISTRY}/${OWNER}/$(echo "$SHORT_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # Artifact-safe version of the name, used for cache scopes and artifact names
          echo "slug=$(printf '%s' "$SHORT_NAME" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_IMAGE_NAME: ${{ inputs.image-name }}
          INPUTS_REGISTRY: ${{ inputs.registry }}
          INPUTS_PLATFORMS: ${{ inputs.platforms }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.image.outputs.full }}
          labels: |
            org.opencontainers.image.vendor=Naira Project
            ${{ inputs.image-labels }}
          # Also sets org.opencontainers.image.version, so the tag rules must live here
          tags: |
            # Explicit release tag injected by the release workflow (takes priority)
            type=raw,value=${{ inputs.image-tag }},enable=${{ inputs.image-tag != '' }}
            # Tag with full semver on version tags (v1.2.3 → 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Branch builds → branch-name
            type=ref,event=branch
            # PR builds → pr-42
            type=ref,event=pr
            # Always tag latest on default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable SHA tag for traceability
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password }}

      # Pushed without a tag; the publish job tags the combined image
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.full }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # One cache per image and architecture, otherwise they overwrite each other
          cache-from: type=gha,scope=${{ steps.image.outputs.slug }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.slug }}-${{ matrix.arch }}
          sbom: true
          provenance: true

      # Matrix jobs cannot return one output per leg, so each leg hands its
      # digest to the publish job as an (empty) file named after the digest.
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # "--" separates image and arch so the download pattern of image "foo"
          # cannot match the digests of image "foo-bar" built in the same run
          name: digests-${{ steps.image.outputs.slug }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Required for Cosign keyless signing and SLSA provenance attestation
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      tags: ${{ needs.build.outputs.tags }}
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.build.outputs.slug }}--*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ${{ inputs.registry }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password }}

      - name: Create and push multi-arch image
        id: manifest
        run: |
          ARGS=()
          while read -r tag; do
            [ -n "$tag" ] && ARGS+=(--tag "$tag")
          done <<< "$TAGS"
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            ARGS+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest.json" "${ARGS[@]}"
          echo "digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")" >> "$GITHUB_OUTPUT"
        env:
          TAGS: ${{ needs.build.outputs.tags }}

      - name: Install Cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign (keyless)
        if: inputs.sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}

      # ── Attestation (SLSA Level 2) ─────────────────────────────────────────
      - name: Attest image provenance
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ needs.build.outputs.slug }}
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: ${{ inputs.provenance-retention-days }}
          if-no-files-found: error

      - name: Write job summary
        run: |
          {
            echo "### 🐳 Image Published"
            echo "**Image Ref:** \`${IMAGE}@${DIGEST}\`"
            echo "**Provenance:** ${ATTESTATION_URL}"
            echo "**Tags:**"
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
